[source]
# 推荐配置：需要监听的 QQ 群名或联系人昵称，使用精确匹配；可在 Web UI 中增删。
listener_names = ["A群名称", "联系人昵称"]
# 兼容旧配置：第一个监听会话名称。Web UI 会同步更新下面两个旧字段。
group_name = "A群名称"
group_names = ["A群名称", "联系人昵称"]
app_name_contains = "QQ"
# 通知事件优先唤醒；事件不可用时使用 200ms 快速轮询。
poll_interval_seconds = 0.2
# 这些文本不会被当作聊天消息。可以按 inspect-window 输出继续增加。
exclude_texts = ["A群名称", "发送", "关闭", "最小化"]
# 可选：QQ 图片缓存目录。留空时自动探测常见的 QQ NT 缓存目录。
image_cache_paths = []
# 通知时间前后允许匹配的缓存文件时间范围。
image_cache_match_seconds = 60.0
# 文件刚生成时等待其写入完成的时间。
image_cache_settle_seconds = 0.25
# 图片通知到达后，最多持续扫描多久等待 QQ 写入缓存。
image_cache_wait_seconds = 45.0
# UI 自动打开群聊并复制图片的最长等待时间。
ui_image_wait_seconds = 8.0

[destination]
app_id = "替换为机器人 AppID"
client_secret_env = "QQ_BOT_CLIENT_SECRET"
group_openid = "替换为 B 群 group_openid"
message_prefix = "[A群转发]"

[runtime]
database_path = "data/forwarder.sqlite3"
log_path = "data/forwarder.log"
dry_run = true
max_send_attempts = 3
